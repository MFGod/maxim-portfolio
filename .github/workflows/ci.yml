name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон — очередь не копится.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci, а не install: ставит ровно то, что в package-lock.json.
      - run: npm ci

      # Форматирование отдельным шагом: verify его не проверяет.
      - run: npm run format:check

      - run: npm run verify
